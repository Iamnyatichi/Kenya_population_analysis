  <style>
    body {

      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      border-radius: 5px;
    }

    .info h4 {
      margin: 0 0 5px;
      color: #777;
    }

    .legend {
      width: 100px;
      /* legend width, remove if unnecessary*/
      line-height: 18px;
      color: #555;
    }

    .legend i {
      width: 18px;
      height: 18px;
      float: left;

<body>

  <div class="heading">
    <div class='intro'>
      <h1 class='title'>Interactive Choropleth Maps</h1>
      <h2>Kenya Population Density</h2>
    </div>
    <div class="social_links">
      <a href="https://github.com/Iamnyatichi/Kenya_population_analysis" target="_blank"><i
          class="fa-brands fa-square-github" aria-hidden="true"></i></a>
      <a href="https://www.linkedin.com/in/theresa-monari-4a366527a/" target="_blank"><i
          class="fa-brands fa-linkedin-in"></i></a>
    </div>
  </div>
  <div class="pages">
    <ul>
      <li><a class="active" href="index.html" target="_self">Kenya</a></li>
      <li><a href="us_population.html" target="_self">USA</a></li>
      <li><a href="kenya_gdp.html" target="_self">Kenya GDP</a></li>
    </ul>
  </div>


  <div id="map"></div>
  <script>
    var map = L.map('map').setView([0.0236, 37.9090], 6);

    var tiles = L.tileLayer('https://api.maptiler.com/maps/openstreetmap/{z}/{x}/{y}.jpg?key=xWxBRTFAUoZnsgRnZQvA', {
      attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
      maxZoom: 19
    }).addTo(map);
    // L.geoJson(data).addTo(map);

    // control that shows county information on hover
    const info = L.control();

    info.onAdd = function (map) {
      this._div = L.DomUtil.create('div', 'info');
      this.update();
      return this._div;
    };

    info.update = function (props) {
      const contents = props ? `<b style='font-size:20px;color:#6e016b'>${props.County}</b><br />  <b style='font-size:15px;'>${props["Pop_density(People/sq.Km)"]}   People / Km<sup>2</sup></b> ` : '<span style="font-size:15px;">Hover over a county!</span></b>'
      this._div.innerHTML = `<h4 style='font-size:25px;color:black;'>Kenya Population Density</h4>${contents}`;
    };

    info.addTo(map);


    // Ading the colors based on the data
    function getColor(d) {
      return d > 5000 ? '#49006a' :
        d > 900 ? '#7a0177' :
          d > 500 ? '#ae017e' :
            d > 300 ? '#dd3497' :
              d > 100 ? '#f768a1' :
                d > 50 ? '#fa9fb5' :
                  d > 20 ? '#fcc5c0' :
                    d > 10 ? '#fde0dd' : '#fff7f3';
    }

    function style(feature) {
      return {
        fillColor: getColor(feature.properties["Pop_density(People/sq.Km)"]),
        weight: 1,
        opacity: 1,
        color: 'black',
        dashArray: '',
        fillOpacity: 0.7
      };
    }
    // update the control when the user hovers over a county 
    function highlightFeature(e) {
      const layer = e.target;

      layer.setStyle({
        weight: 3,
        color: '#525252',
        dashArray: '',
        fillOpacity: 0.7
      });

      layer.bringToFront();

      info.update(layer.feature.properties);
    }

    /* The Kenya data*/
    const geojson = L.geoJson(data, {
      style,
      onEachFeature
    }).addTo(map);

    function resetHighlight(e) {
      geojson.resetStyle(e.target);
      info.update();
    }

    function zoomToFeature(e) {
      map.fitBounds(e.target.getBounds());
    }

    function onEachFeature(feature, layer) {
      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight,
        click: zoomToFeature
      });
    }

    map.attributionControl.addAttribution('Population data &copy; <a href="https://www.citypopulation.de/">Citypopulation.de</a>');

    // custom legend
    var legend = L.control({ position: 'bottomright' });

    legend.onAdd = function (map) {

      var div = L.DomUtil.create('div', 'info legend'),
        grades = [0, 10, 20, 50, 100, 300, 500, 900, 5000],
        labels = [];

      // loop through our density intervals and generate a label with a colored square for each interval
      for (var i = 0; i < grades.length; i++) {
        div.innerHTML +=
          '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
          grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
      }

      return div;
    };

    legend.addTo(map);

  </script>


</body>

</html>
